# JSON Schema (YAML representation) for email_triage routine config.
#
# The framework validates the per-client config at install time. Cross-field
# rules:
#   * trust_promotion.threshold >= 1 when trust_promotion.enabled is true
#   * Each template name in `auto_send.allowed_templates` must appear in
#     `templates[]`.
#   * `categories[].template` must reference a `templates[].name`.
#   * `polling.seconds` between 10 and 3600.

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://ota.framework/schemas/email_triage/config-0.1.0.json"
title: EmailTriageConfig
type: object
additionalProperties: false
required:
  - mailbox
  - categories
  - templates
properties:
  mailbox:
    type: object
    additionalProperties: false
    required: [folder]
    properties:
      folder:
        type: string
        minLength: 1
        description: Gmail label / IMAP folder name to poll (e.g. "INBOX").
  polling:
    type: object
    additionalProperties: false
    properties:
      seconds:
        type: integer
        minimum: 10
        maximum: 3600
        default: 60
  categories:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [name, template]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        template:
          type: string
          minLength: 1
        keywords:
          type: array
          items:
            type: string
            minLength: 1
  templates:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [name, subject_pattern, body_path]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        subject_pattern:
          type: string
          description: |
            Template string with `{thread_subject}` etc. placeholders.
        body_path:
          type: string
          description: Relative path to a markdown body template under the routine bundle.
        signature:
          type: string
  trust_promotion:
    type: object
    additionalProperties: false
    properties:
      enabled:
        type: boolean
        default: true
      threshold:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
        description: Consecutive un-edited approvals before auto-send turns on for a template.
  auto_send:
    type: object
    additionalProperties: false
    properties:
      allowed_templates:
        type: array
        items:
          type: string
          minLength: 1
        description: |
          Templates the operator has opted in to auto-send (in addition to trust-promotion).
  drift:
    type: object
    additionalProperties: false
    properties:
      enabled:
        type: boolean
        default: true
      window_hours:
        type: integer
        minimum: 1
        maximum: 168
        default: 24
      processed_skip_ratio_alarm:
        type: number
        minimum: 0
        maximum: 1
        default: 0.4
      draft_send_ratio_alarm:
        type: number
        minimum: 0
        maximum: 1
        default: 0.3
  notifications:
    type: object
    additionalProperties: false
    properties:
      approval_channel:
        type: string
        description: |
          Slack channel id / handle that receives approval cards.
          When omitted the routine uses the operator's DM (Identity Provider lookup).
