target-version = "py312"
line-length = 100

[lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "RUF",   # ruff-specific
]
ignore = [
    # vocabulary specs use Generic[T] (legacy) for type-parameterized classes;
    # auto-rewrite to PEP 695 is unsafe (orphans the TypeVar declaration).
    "UP046",
    # Generic function form `def f[T](...)` (PEP 695). Codebase uses the
    # `TypeVar`-based form for consistency with the generic classes above.
    "UP047",
]

[lint.per-file-ignores]
# FastAPI's `Depends()` / `Query()` are idiomatic in argument defaults; B008
# is not the right rule for them.
"ota_dashboard_api/routes/*.py" = ["B008"]

[format]
quote-style = "double"
indent-style = "space"
